<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" role="img" aria-label="Languages used across public repositories.">
<style>
.title { font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #9198a1; letter-spacing: 1px; }
.value { font: 650 25px ui-sans-serif, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; fill: #e6edf3; letter-spacing: -.4px; }
.small { font: 400 12px ui-sans-serif, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; fill: #e6edf3; }
.muted { font: 400 12px ui-sans-serif, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; fill: #9198a1; }
.tick { font: 400 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #9198a1; }
.rail { stroke: #30363d; stroke-width: 1; }
.track { fill: #30363d; opacity: .55; }
.bar { fill: #e3b341; }
.grow { transform-box: fill-box; transform-origin: bottom; animation: grow .7s cubic-bezier(.2,.7,.2,1) both; }
.fill { transform-box: fill-box; transform-origin: left; animation: fill .8s cubic-bezier(.2,.7,.2,1) both; }
@keyframes grow { from { transform: scaleY(0); } }
@keyframes fill { from { transform: scaleX(0); } }
@media (prefers-reduced-motion: reduce) { .grow, .fill { animation: none; } }
</style>
<rect x=".5" y=".5" width="399" height="209" rx="10" fill="#161b22" stroke="#30363d"/>
<text class="title" x="20" y="32">LANGUAGES</text>
<text class="title" x="380" y="32" text-anchor="end">PUBLIC REPOS</text>
<text class="small" x="20" y="58">JavaScript</text>
<text class="small" x="380" y="58" text-anchor="end">44%</text>
<rect class="track" x="20" y="64" width="360" height="6" rx="3"/>
<rect class="fill" style="animation-delay:0ms" x="20" y="64" width="157.4" height="6" rx="3" fill="#3987e5"/>
<text class="small" x="20" y="85">TypeScript</text>
<text class="small" x="380" y="85" text-anchor="end">22%</text>
<rect class="track" x="20" y="91" width="360" height="6" rx="3"/>
<rect class="fill" style="animation-delay:70ms" x="20" y="91" width="80.0" height="6" rx="3" fill="#199e70"/>
<text class="small" x="20" y="112">Python</text>
<text class="small" x="380" y="112" text-anchor="end">22%</text>
<rect class="track" x="20" y="118" width="360" height="6" rx="3"/>
<rect class="fill" style="animation-delay:140ms" x="20" y="118" width="77.9" height="6" rx="3" fill="#d95926"/>
<text class="small" x="20" y="139">CSS</text>
<text class="small" x="380" y="139" text-anchor="end">11%</text>
<rect class="track" x="20" y="145" width="360" height="6" rx="3"/>
<rect class="fill" style="animation-delay:210ms" x="20" y="145" width="40.5" height="6" rx="3" fill="#c98500"/>
<text class="small" x="20" y="166">HTML</text>
<text class="small" x="380" y="166" text-anchor="end">1%</text>
<rect class="track" x="20" y="172" width="360" height="6" rx="3"/>
<rect class="fill" style="animation-delay:280ms" x="20" y="172" width="4.0" height="6" rx="3" fill="#d55181"/>
<text class="small" x="20" y="193">Other</text>
<text class="small" x="380" y="193" text-anchor="end">&lt;1%</text>
<rect class="track" x="20" y="199" width="360" height="6" rx="3"/>
<rect class="fill" style="animation-delay:350ms" x="20" y="199" width="3.0" height="6" rx="3" fill="#656c76"/>
</svg>
