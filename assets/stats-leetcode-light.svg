<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" role="img" aria-label="148 LeetCode problems solved.">
<style>
.title { font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #59636e; letter-spacing: 1px; }
.value { font: 650 25px ui-sans-serif, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; fill: #1f2328; letter-spacing: -.4px; }
.small { font: 400 12px ui-sans-serif, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; fill: #1f2328; }
.muted { font: 400 12px ui-sans-serif, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; fill: #59636e; }
.tick { font: 400 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #59636e; }
.rail { stroke: #d1d9e0; stroke-width: 1; }
.track { fill: #d1d9e0; opacity: .55; }
.bar { fill: #9a6700; }
.grow { transform-box: fill-box; transform-origin: bottom; animation: grow .7s cubic-bezier(.2,.7,.2,1) both; }
.fill { transform-box: fill-box; transform-origin: left; animation: fill .8s cubic-bezier(.2,.7,.2,1) both; }
@keyframes grow { from { transform: scaleY(0); } }
@keyframes fill { from { transform: scaleX(0); } }
@media (prefers-reduced-motion: reduce) { .grow, .fill { animation: none; } }
</style>
<rect x=".5" y=".5" width="399" height="209" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
<text class="title" x="20" y="32">LEETCODE</text>

<text class="value" x="20" y="76">148</text>
<text class="muted" x="74" y="76">problems solved</text>
<text class="small" x="20" y="110">Easy</text>
<text class="small" x="380" y="110" text-anchor="end">66 / 975</text>
<rect class="track" x="20" y="116" width="360" height="6" rx="3"/>
<rect class="fill" style="animation-delay:0ms" x="20" y="116" width="24.4" height="6" rx="3" fill="#9a6700"/>
<text class="small" x="20" y="144">Medium</text>
<text class="small" x="380" y="144" text-anchor="end">69 / 2145</text>
<rect class="track" x="20" y="150" width="360" height="6" rx="3"/>
<rect class="fill" style="animation-delay:70ms" x="20" y="150" width="11.6" height="6" rx="3" fill="#9a6700"/>
<text class="small" x="20" y="178">Hard</text>
<text class="small" x="380" y="178" text-anchor="end">13 / 989</text>
<rect class="track" x="20" y="184" width="360" height="6" rx="3"/>
<rect class="fill" style="animation-delay:140ms" x="20" y="184" width="4.7" height="6" rx="3" fill="#9a6700"/>
</svg>
